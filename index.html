let state=JSON.parse(localStorage.getItem('litProState')||'{"done":0,"right":0,"wrong":[],"history":[]}');
let queue=[],idx=0,selected=[],answered=false,mode='mixed';
const $=id=>document.getElementById(id);
function save(){localStorage.setItem('litProState',JSON.stringify(state));renderStats()}
function renderStats(){$('sDone').textContent=state.done;$('sRight').textContent=state.right;$('sRate').textContent=state.done?Math.round(state.right/state.done*100)+'%':'0%';$('sWrong').textContent=state.wrong.length}
function initCats(){let cats=[...new Set(QUESTIONS.map(x=>x.cat))];$('cat').innerHTML=cats.map(c=>`<option>${c}</option>`).join('')}
function showPage(id,btn){['home','quiz','wrong','report'].forEach(x=>$(x).classList.add('hidden'));$(id).classList.remove('hidden');document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));if(btn)btn.classList.add('active')}
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function start(m){mode=m;if(m==='advanced')queue=shuffle(QUESTIONS.filter(x=>x.level==='教招'));else if(m==='exam')queue=shuffle(QUESTIONS).slice(0,50);else if(m==='wrong')queue=shuffle(QUESTIONS.filter(x=>state.wrong.includes(x.id)));else if(m==='category')queue=shuffle(QUESTIONS.filter(x=>x.cat===$('cat').value));else queue=shuffle(QUESTIONS);if(!queue.length){alert('当前没有可刷题目');return}idx=0;showPage('quiz');renderQ()}
function typeName(t){return t==='multi'?'多选题':t==='judge'?'判断题':'单选题'}
function renderQ(){answered=false;selected=[];let x=queue[idx];$('bar').style.width=((idx)/queue.length*100)+'%';$('typeBadge').textContent=typeName(x.type);$('catBadge').textContent=x.cat;$('count').textContent=`${idx+1} / ${queue.length}`;$('question').textContent=x.q;$('exp').className='exp';$('exp').innerHTML='';$('submitBtn').classList.remove('hidden');$('nextBtn').classList.add('hidden');let opts=x.type==='judge'?['正确','错误']:x.opts;$('options').innerHTML=opts.map((o,i)=>`<button class="opt" onclick="pick(${i},this)">${String.fromCharCode(65+i)}. ${o}</button>`).join('')}
function pick(i,btn){if(answered)return;let x=queue[idx];if(x.type==='multi'){btn.classList.toggle('sel');selected.includes(i)?selected=selected.filter(v=>v!==i):selected.push(i)}else{selected=[i];document.querySelectorAll('.opt').forEach(b=>b.classList.remove('sel'));btn.classList.add('sel')}}
function isRight(x){if(x.type==='judge')return (selected[0]===0)===x.ans;if(x.type==='multi')return JSON.stringify([...selected].sort())===JSON.stringify([...x.ans].sort());return selected[0]===x.ans}
function correctIndexes(x){if(x.type==='judge')return [x.ans?0:1];return Array.isArray(x.ans)?x.ans:[x.ans]}
function submitAnswer(){if(!selected.length){alert('请先选择答案');return}answered=true;let x=queue[idx],right=isRight(x),ci=correctIndexes(x);document.querySelectorAll('.opt').forEach((b,i)=>{if(ci.includes(i))b.classList.add('correct');else if(selected.includes(i))b.classList.add('wrong')});state.done++;if(right){state.right++;state.wrong=state.wrong.filter(id=>id!==x.id)}else if(!state.wrong.includes(x.id))state.wrong.push(x.id);state.history.push({id:x.id,right,date:Date.now()});if(state.history.length>500)state.history.shift();save();$('exp').innerHTML=`<b>${right?'回答正确':'回答错误'}</b><br>${x.exp}`;$('exp').classList.add('show');$('submitBtn').classList.add('hidden');$('nextBtn').classList.remove('hidden')}
function nextQ(){idx++;if(idx>=queue.length){finish();return}renderQ()}
function finish(){let recent=state.history.slice(-queue.length),r=recent.filter(x=>x.right).length;alert(`本轮完成：${r} / ${queue.length}`);showPage('home');renderStats()}
function quitQuiz(){showPage('home')}
function showWrong(btn){showPage('wrong',btn);let arr=QUESTIONS.filter(x=>state.wrong.includes(x.id));$('wrongList').innerHTML=arr.length?arr.map(x=>`<div class="listitem"><b>${x.q}</b><br><span style="color:var(--muted)">${x.exp}</span></div>`).join(''):'<div class="empty">暂时没有错题</div>'}
function showReport(btn){showPage('report',btn);let by={};state.history.forEach(h=>{let q=QUESTIONS.find(x=>x.id===h.id);if(!q)return;by[q.cat]??={d:0,r:0};by[q.cat].d++;if(h.right)by[q.cat].r++});let rows=Object.entries(by).sort((a,b)=>b[1].d-a[1].d).map(([k,v])=>`<div class="listitem"><b>${k}</b><span style="float:right">${Math.round(v.r/v.d*100)}%</span><br><small style="color:var(--muted)">已做 ${v.d} 题，答对 ${v.r} 题</small></div>`).join('');$('reportBox').innerHTML=rows||'<div class="empty">完成几道题后，这里会生成模块正确率。</div>'}
initCats();renderStats();
</script></body></html>

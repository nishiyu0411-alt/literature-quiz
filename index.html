const DEFAULT_STATE={done:0,right:0,wrong:[],history:[],completed:[],session:null};
let state;try{state=Object.assign({},DEFAULT_STATE,JSON.parse(localStorage.getItem('litProStateV2')||'{}'))}catch(e){state={...DEFAULT_STATE}}
state.completed=Array.isArray(state.completed)?state.completed:[];state.wrong=Array.isArray(state.wrong)?state.wrong:[];state.history=Array.isArray(state.history)?state.history:[];
let queue=[],idx=0,selected=[],answered=false,mode='mixed';const $=id=>document.getElementById(id);
function save(){localStorage.setItem('litProStateV2',JSON.stringify(state));renderStats();renderContinue();updateCatRemain()}
function renderStats(){$('sDone').textContent=state.completed.length;$('sRight').textContent=state.right;$('sRate').textContent=state.done?Math.round(state.right/state.done*100)+'%':'0%';$('sRemain').textContent=Math.max(0,QUESTIONS.length-state.completed.length)}
function initCats(){let cats=[...new Set(QUESTIONS.map(x=>x.cat))];$('cat').innerHTML=cats.map(c=>`<option>${c}</option>`).join('');$('cat').addEventListener('change',updateCatRemain)}
function showPage(id,btn){['home','quiz','wrong','report'].forEach(x=>$(x).classList.add('hidden'));$(id).classList.remove('hidden');document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));if(btn)btn.classList.add('active')}
function shuffle(a){return [...a].sort(()=>Math.random()-.5)} function batch(){return Number($('batchSize').value)||20} function ordered(a){return $('orderMode').value==='sequence'?[...a].sort((x,y)=>x.id-y.id):shuffle(a)}
function available(fn){return QUESTIONS.filter(q=>fn(q)&&!state.completed.includes(q.id))}
function start(m){mode=m;let pool=[];if(m==='advanced')pool=available(q=>q.level==='教招');else if(m==='mixed'||m==='exam')pool=available(q=>true);else if(m==='category')pool=available(q=>q.cat===$('cat').value);else if(m==='wrong')pool=QUESTIONS.filter(q=>state.wrong.includes(q.id));if(!pool.length){alert(m==='wrong'?'当前没有错题。':'这个范围内的题已经全部刷完，可重置模块进度后再练。');return}queue=ordered(pool).slice(0,batch());idx=0;state.session={mode,ids:queue.map(q=>q.id),idx:0};save();showPage('quiz');renderQ()}
function continueSession(){if(!state.session)return;queue=state.session.ids.map(id=>QUESTIONS.find(q=>q.id===id)).filter(Boolean);idx=Math.min(state.session.idx||0,Math.max(0,queue.length-1));mode=state.session.mode||'mixed';showPage('quiz');renderQ()}
function renderContinue(){let s=state.session;if(s&&s.ids&&s.idx<s.ids.length){$('continueCard').classList.remove('hidden');$('continueText').textContent=`已完成 ${s.idx} / ${s.ids.length} 题，进度已保存。`}else $('continueCard').classList.add('hidden')}
function typeName(t){return t==='multi'?'多选题':t==='judge'?'判断题':'单选题'}
function renderQ(){answered=false;selected=[];let x=queue[idx];if(!x){finish();return}$('bar').style.width=(idx/queue.length*100)+'%';$('typeBadge').textContent=typeName(x.type);$('catBadge').textContent=x.cat;$('count').textContent=`${idx+1} / ${queue.length}`;$('question').textContent=x.q;$('exp').className='exp';$('exp').innerHTML='';$('submitBtn').classList.remove('hidden');$('nextBtn').classList.add('hidden');let opts=x.type==='judge'?['正确','错误']:x.opts;$('options').innerHTML=opts.map((o,i)=>`<button class="opt" onclick="pick(${i},this)">${String.fromCharCode(65+i)}. ${o}</button>`).join('')}
function pick(i,btn){if(answered)return;let x=queue[idx];if(x.type==='multi'){btn.classList.toggle('sel');selected.includes(i)?selected=selected.filter(v=>v!==i):selected.push(i)}else{selected=[i];document.querySelectorAll('.opt').forEach(b=>b.classList.remove('sel'));btn.classList.add('sel')}}
function isRight(x){if(x.type==='judge')return (selected[0]===0)===x.ans;if(x.type==='multi')return JSON.stringify([...selected].sort())===JSON.stringify([...x.ans].sort());return selected[0]===x.ans}
function correctIndexes(x){if(x.type==='judge')return [x.ans?0:1];return Array.isArray(x.ans)?x.ans:[x.ans]}
function submitAnswer(){if(!selected.length){alert('请先选择答案');return}answered=true;let x=queue[idx],right=isRight(x),ci=correctIndexes(x);document.querySelectorAll('.opt').forEach((b,i)=>{if(ci.includes(i))b.classList.add('correct');else if(selected.includes(i))b.classList.add('wrong')});state.done++;if(right){state.right++;state.wrong=state.wrong.filter(id=>id!==x.id)}else if(!state.wrong.includes(x.id))state.wrong.push(x.id);if(!state.completed.includes(x.id))state.completed.push(x.id);state.history.push({id:x.id,right,date:Date.now()});if(state.history.length>1500)state.history.shift();if(state.session)state.session.idx=idx+1;save();$('exp').innerHTML=`<b>${right?'回答正确':'回答错误'}</b><br>${x.exp}`;$('exp').classList.add('show');$('submitBtn').classList.add('hidden');$('nextBtn').classList.remove('hidden')}
function nextQ(){idx++;if(state.session){state.session.idx=idx;save()}if(idx>=queue.length){finish();return}renderQ()}
function saveAndQuit(){if(state.session)state.session.idx=idx;save();showPage('home')}
function quitQuiz(){saveAndQuit()}
function finish(){state.session=null;save();alert('本轮练习已完成，进度已经保存。');showPage('home')}
function updateCatRemain(){let c=$('cat')&&$('cat').value;if(!c)return;let n=QUESTIONS.filter(q=>q.cat===c&&!state.completed.includes(q.id)).length;$('catRemain').textContent=`本模块还有 ${n} 道未刷题`}
function resetCategory(){let c=$('cat').value;if(!confirm(`确定重置“${c}”的刷题进度吗？`))return;let ids=QUESTIONS.filter(q=>q.cat===c).map(q=>q.id);state.completed=state.completed.filter(id=>!ids.includes(id));state.session=null;save()}
function showWrong(btn){showPage('wrong',btn);let arr=QUESTIONS.filter(x=>state.wrong.includes(x.id));$('wrongList').innerHTML=arr.length?arr.map(x=>`<div class="listitem"><b>${x.q}</b><br><span style="color:var(--muted)">${x.exp}</span></div>`).join(''):'<div class="empty">暂时没有错题</div>'}
function showReport(btn){showPage('report',btn);let by={};state.history.forEach(h=>{let q=QUESTIONS.find(x=>x.id===h.id);if(!q)return;by[q.cat]??={d:0,r:0};by[q.cat].d++;if(h.right)by[q.cat].r++});let rows=Object.entries(by).sort((a,b)=>b[1].d-a[1].d).map(([k,v])=>`<div class="listitem"><b>${k}</b><span style="float:right">${Math.round(v.r/v.d*100)}%</span><br><small style="color:var(--muted)">已做 ${v.d} 题，答对 ${v.r} 题</small></div>`).join('');$('reportBox').innerHTML=rows||'<div class="empty">完成几道题后，这里会生成模块正确率。</div>'}
initCats();renderStats();renderContinue();updateCatRemain();
</script></body></html>
